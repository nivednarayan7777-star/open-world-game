name: blend-probe

# Manual only: downloads the reference .blend, reads its scene + node graphs and
# renders it, then commits the results back to the branch it runs on. Run it
# from the Actions tab when you want to re-measure the reference.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLEND_ID: 14n6aOH6rBLe40mVZOaBFPoSId_nB7qhS
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download .blend from Drive
        id: fetch
        continue-on-error: true
        run: bash .github/fetch_blend.sh

      - name: Install Blender
        if: steps.fetch.outcome == 'success'
        id: blender
        continue-on-error: true
        run: bash .github/install_blender.sh

      - name: Probe scene
        if: steps.fetch.outcome == 'success' && steps.blender.outcome == 'success'
        continue-on-error: true
        run: bash .github/run_probe.sh

      - name: Publish results
        if: always()
        run: bash .github/publish.sh
